[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revterm"
version = "0.1.0"
description = "A sleek, real-time Stripe & SaaS metrics terminal dashboard for developers and founders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
revterm = "revterm.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["revterm*"]
